    /* StudyForge v1.8 — keyboard reliability, transition safety, performance, responsive terms */
    :root{--study-font:"Hurme Geometric Sans","Hurme Geometric Sans No.4",Arial,sans-serif;--ui-font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}

    /* Long inline LaTeX remains inline when it fits and can never paint over adjacent content. */
    .math-inline{
      display:inline-block!important;
      max-width:100%!important;
      overflow-x:auto!important;

      overflow-x:auto!important;
      overflow-y:hidden!important;
